name: Publish
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to publish (<package directory>-vX.Y.Z, e.g. folio-charts-v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release
        id: release
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          node --input-type=module <<'NODE'
          import { execSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const match = /^([a-z0-9-]+)-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(process.env.RELEASE_REF);
          if (!match) throw new Error('Tag must be <package directory>-vX.Y.Z');
          const [, directory, version] = match;
          const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
          if (pkg.version !== version) throw new Error('Tag must match package version');
          if (!pkg.repository) throw new Error('Set the public repository metadata before publishing');
          const [major, minor] = execSync('npm -v').toString().trim().split('.').map(Number);
          if (major < 11 || (major === 11 && minor < 15)) throw new Error('npm stage requires npm 11.15.0 or newer');
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=packages/${directory}\n`);
          NODE
      - run: npm ci
      - run: npm run check
      # The trusted publisher is stage-only: the release waits in npm's stage queue
      # until a maintainer approves it with 2FA (npmjs.com → Staged Packages, or
      # `npm stage list` + `npm stage approve <stage-id>`).
      - name: Stage release
        working-directory: ${{ steps.release.outputs.directory }}
        run: npm stage publish --ignore-scripts --access public --provenance
